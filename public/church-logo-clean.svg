<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8E6E2F"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Transparent Outer Background -->

  <!-- Golden Wreath / Outer Emblem Circle Border (Transparent Inside) -->
  <circle cx="60" cy="58" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Left Wheat Stalk -->
  <g fill="url(#goldGrad)">
    <path d="M 22 75 C 18 55 25 35 34 25 C 32 32 30 45 28 55 C 26 63 24 70 22 75 Z"/>
    <ellipse cx="21" cy="62" rx="4" ry="2" transform="rotate(-30 21 62)"/>
    <ellipse cx="23" cy="52" rx="4.5" ry="2.2" transform="rotate(-35 23 52)"/>
    <ellipse cx="26" cy="42" rx="4.5" ry="2.2" transform="rotate(-40 26 42)"/>
    <ellipse cx="30" cy="33" rx="4" ry="2" transform="rotate(-45 30 33)"/>
  </g>

  <!-- Right Wheat Stalk -->
  <g fill="url(#goldGrad)">
    <path d="M 98 75 C 102 55 95 35 86 25 C 88 32 90 45 92 55 C 94 63 96 70 98 75 Z"/>
    <ellipse cx="99" cy="62" rx="4" ry="2" transform="rotate(30 99 62)"/>
    <ellipse cx="97" cy="52" rx="4.5" ry="2.2" transform="rotate(35 97 52)"/>
    <ellipse cx="94" cy="42" rx="4.5" ry="2.2" transform="rotate(40 94 42)"/>
    <ellipse cx="90" cy="33" rx="4" ry="2" transform="rotate(45 90 33)"/>
  </g>

  <!-- Central "B" Monogram (Green & Gold) -->
  <!-- Vertical Spine of B -->
  <path d="M 44 24 L 44 76 L 54 76 L 54 24 Z" fill="#1B4D2E" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Upper Loop of B -->
  <path d="M 54 24 L 68 24 C 77 24 82 29 82 37 C 82 45 76 49 68 49 L 54 49 Z" fill="#1B4D2E" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M 54 30 L 66 30 C 71 30 75 33 75 37 C 75 41 71 44 66 44 L 54 44 Z" fill="#FFFFFF"/>

  <!-- Lower Loop of B -->
  <path d="M 54 47 L 70 47 C 80 47 86 52 86 61 C 86 70 79 76 68 76 L 54 76 Z" fill="#1B4D2E" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M 54 53 L 67 53 C 74 53 79 56 79 61 C 79 66 74 70 67 70 L 54 70 Z" fill="#FFFFFF"/>

  <!-- Red Cross inside Top Inner Loop -->
  <g fill="#D32F2F">
    <rect x="63" y="32" width="4" height="11" rx="0.5"/>
    <rect x="59.5" y="34.5" width="11" height="4" rx="0.5"/>
  </g>

  <!-- White Flying Dove in Lower Loop -->
  <g fill="#FFFFFF" stroke="#8E6E2F" stroke-width="0.5">
    <!-- Body & Head -->
    <path d="M 62 60 C 65 57 70 56 73 58 C 76 60 75 64 71 65 C 67 66 63 63 62 60 Z"/>
    <!-- Wing -->
    <path d="M 64 61 C 61 54 67 50 71 52 C 69 56 67 59 64 61 Z"/>
    <!-- Tail -->
    <path d="M 72 64 L 77 67 L 75 63 Z"/>
  </g>

  <!-- Open Holy Bible at Base -->
  <g transform="translate(60, 78)">
    <!-- Cover Base -->
    <path d="M -24 3 L 0 -1 L 24 3 L 22 13 L 0 8 L -22 13 Z" fill="#5D4037"/>
    <!-- Left Page -->
    <path d="M -22 1 L 0 -3 L 0 7 L -22 10 Z" fill="#FFFBF0" stroke="#C5A059" stroke-width="0.5"/>
    <!-- Right Page -->
    <path d="M 22 1 L 0 -3 L 0 7 L 22 10 Z" fill="#FFFBF0" stroke="#C5A059" stroke-width="0.5"/>
    <!-- Book Ribbon Marker -->
    <path d="M 0 -3 C 2 3 3 8 5 12" stroke="#D32F2F" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Banner / Ribbon at Bottom with Text -->
  <g filter="url(#shadow)">
    <!-- Banner Ribbon Background -->
    <path d="M 20 95 L 32 91 L 88 91 L 100 95 L 94 104 L 86 100 L 34 100 L 26 104 Z" fill="#1B4D2E" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M 30 92 L 90 92 L 86 100 L 34 100 Z" fill="#143A22"/>
    <!-- Banner Text -->
    <text x="60" y="97.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.2" font-weight="800" fill="#E5C158" text-anchor="middle" letter-spacing="0.5">
      BETHESDA AG CHURCH
    </text>
  </g>
</svg>
